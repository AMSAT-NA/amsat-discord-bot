services:
  bot:
    build:
      context: .
      target: builder        # Use the build stage image (includes dev deps)
    container_name: amsat-discord-bot-dev
    env_file: .env
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
      DATABASE_PATH: /data/bot.db
    volumes:
      - ./src:/app/src       # Live-reload source changes
      - bot-data-dev:/data
    command: npx ts-node-dev --respawn --transpile-only src/index.ts

volumes:
  bot-data-dev:
    driver: local
