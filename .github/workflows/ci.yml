name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Typecheck & compile ───────────────────────────────────────────────
  build:
    name: Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  # ── Job 2: Docker build test (all branches, no push) ────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          push: false
          tags: amsat-discord-bot:ci
          build-args: COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 3: Push to ACR (main branch only) ────────────────────────────────────
  push:
    name: Push to ACR
    runs-on: ubuntu-latest
    needs: [build, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      id-token: write   # required for OIDC token request
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_ACR_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ACR
        run: az acr login --name ${{ vars.AZURE_ACR_NAME }}

      - name: Build and push image to ACR
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          push: true
          tags: |
            ${{ vars.AZURE_ACR_NAME }}.azurecr.io/amsat-discord-bot:${{ github.sha }}
            ${{ vars.AZURE_ACR_NAME }}.azurecr.io/amsat-discord-bot:latest
          build-args: COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 4: Configure server environment (main branch only) ──────────────────
  # Builds .env from GitHub secrets/variables and ships it + the compose file
  # to the server. Runs before the deploy job so secrets are in place first.
  configure-env:
    name: Configure Server Environment
    runs-on: ubuntu-latest
    needs: push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOST_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ vars.HOST_ADDRESS }}" >> ~/.ssh/known_hosts

      - name: Ensure service directory exists on server
        run: |
          ssh -i ~/.ssh/deploy_key "${{ vars.HOST_USER }}@${{ vars.HOST_ADDRESS }}" \
            'mkdir -p /opt/services/amsat-discord-bot'

      - name: Generate .env from secrets and variables
        run: |
          cat > /tmp/bot.env <<'ENVEOF'
          DISCORD_TOKEN=${{ secrets.DISCORD_TOKEN }}
          DISCORD_CLIENT_ID=${{ vars.DISCORD_CLIENT_ID }}
          DISCORD_GUILD_ID=${{ vars.DISCORD_GUILD_ID }}
          DISCORD_ADMIN_ROLE_ID=${{ vars.DISCORD_ADMIN_ROLE_ID }}
          WILDAPRICOT_API_KEY=${{ secrets.WILDAPRICOT_API_KEY }}
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION=${{ vars.AWS_REGION }}
          SES_FROM_ADDRESS=${{ vars.SES_FROM_ADDRESS }}
          SES_FROM_NAME=${{ vars.SES_FROM_NAME }}
          ROLE_MAP=${{ vars.ROLE_MAP }}
          LAPSED_ROLE_ID=${{ vars.LAPSED_ROLE_ID }}
          SYNC_CRON=${{ vars.SYNC_CRON }}
          LOG_LEVEL=${{ vars.LOG_LEVEL }}
          ENVEOF
          chmod 600 /tmp/bot.env

      - name: Ship compose file and .env to server
        run: |
          scp -i ~/.ssh/deploy_key \
            deploy/docker-compose.yml \
            "${{ vars.HOST_USER }}@${{ vars.HOST_ADDRESS }}:/opt/services/amsat-discord-bot/docker-compose.yml"
          scp -i ~/.ssh/deploy_key \
            /tmp/bot.env \
            "${{ vars.HOST_USER }}@${{ vars.HOST_ADDRESS }}:/opt/services/amsat-discord-bot/.env"

  # ── Job 5: Pull image and restart container (main branch only) ───────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: configure-env
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOST_DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ vars.HOST_ADDRESS }}" >> ~/.ssh/known_hosts

      - name: Pull image and restart container
        run: |
          ssh -i ~/.ssh/deploy_key "${{ vars.HOST_USER }}@${{ vars.HOST_ADDRESS }}" bash -s <<'ENDSSH'
          docker login amsatorg.azurecr.io \
            --username ${{ vars.AZURE_ACR_CLIENT_ID }} \
            --password ${{ secrets.AZURE_ACR_CLIENT_SECRET }}
          cd /opt/services/amsat-discord-bot
          docker compose pull
          docker compose up -d --force-recreate
          ENDSSH
